name: 'Install'
description: 'Sets up Node.js and runs install'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        # Node 24 is the active LTS ("Krypton"). Matches @types/node, which is already
        # on 24.x -- CI was type-checking against a newer runtime than it ran on.
        node-version: 24
        cache: 'pnpm'
        # `registry-url` is deliberately absent. Setting it makes setup-node write an
        # .npmrc pinning `_authToken` to NODE_AUTH_TOKEN and point NPM_CONFIG_USERCONFIG
        # at it. Under Trusted Publishing that token is empty, so npm would send an empty
        # credential instead of falling through to OIDC -- and npm answers that with E404,
        # which reads as a missing package rather than as an auth failure.
        # Restore it only if publishing moves back to a long-lived NPM_TOKEN.

    - name: Setup Git User
      shell: bash
      run: |
        git config --global user.email "gajus@gajus.com"
        git config --global user.name "Gajus Kuizinas"

    - name: Install dependencies
      shell: bash
      run: pnpm install
