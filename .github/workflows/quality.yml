name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Nothing here writes to the repo. Without this the job token inherits whatever the
# repository default is, which for older repos is read/write across every scope.
permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run oxfmt
        run: pnpm fmt

  # Split three ways because this job was the critical path: ~47s of install
  # followed by ~295s of tests, while no other job in the workflow ran past 2
  # minutes. vitest divides by file, and the split is even -- 70/69/69 of 208.
  #
  # `fail-fast: false` so one failing shard does not cancel the others; knowing
  # only that "a shard failed" means re-running to find out what else broke.
  #
  # This trades runner minutes for wall clock: three shards pay the install cost
  # three times. The jobs run in parallel, so that buys back nothing on a busy
  # runner pool -- revisit if queueing becomes the bottleneck rather than the tests.
  tests:
    name: Unit Tests ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run tests
        run: pnpm test run --shard=${{ matrix.shard }}/3

  # Separate job, not a fourth shard. The root vitest config excludes
  # sandbox/codegen/__tests__/frameworks, so the Solid, Vue, Preact and Qwik
  # suites only ever run here -- sharding `pnpm test` would never reach them.
  codegen:
    name: Codegen Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run codegen tests
        run: pnpm test:codegen

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/composite-actions/install

      # `pnpm install` runs `prepare`, which is `build-fast` -- no type declarations and
      # none of the `postbuild` steps that write the prebuilt artifacts under
      # `packages/generator/src/artifacts/generated`. So nothing here exercises the full
      # build, and a broken postbuild script leaves CI green.
      - name: Run build
        run: pnpm build

      # Those artifacts and `packages/studio/styled-system` are generated *and* tracked,
      # so a build that regenerates them differently means the committed copies are
      # stale. Left unchecked they flip back and forth on every build.
      #
      # `git status --porcelain` rather than `git diff`: a build that starts emitting a
      # *new* generated file leaves it untracked, which `git diff` does not see. Build
      # output that is meant to stay out of the tree is gitignored, so it does not show
      # up here either way.
      - name: Check generated output is committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated output differs after a build. Run 'pnpm build' and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

  browser:
    name: Browser Parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Install Chromium
        run: pnpm --filter sandbox-runtime-perf exec playwright install --with-deps chromium

      # Builds the sandbox twice, with and without the source transform, and compares what
      # a real browser computed. This is the only check that shows a folded class actually
      # *resolves* -- identical markup with a class the stylesheet does not carry looks
      # correct everywhere else.
      #
      # Run through the root script, which sets the flag the root vitest config gates this
      # file on. The Unit Tests job has no browser, so it must not pick this up.
      - name: Run browser parity
        run: pnpm test:browser

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run oxlint
        run: pnpm lint

  knip:
    name: Knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run knip
        run: pnpm knip

  types:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run TypeScript type check
        run: pnpm typecheck
