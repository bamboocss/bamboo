name: Publish

on:
  push:
    paths:
      - '.changeset/**'
      - 'packages/**'
    branches:
      - main
  # The push filter above means a commit touching only .github or the website never
  # runs this, so there is otherwise no way to re-open the Version Packages PR --
  # or to retry a publish -- without manufacturing a commit under packages/.
  workflow_dispatch:

# Publishing is not safe to run twice at once: two jobs can race to version, tag and
# push the same packages. Unlike the other workflows this must never cancel a run in
# flight -- killing it mid-publish is how you get a tag with no npm release behind it.
concurrency:
  group: publish
  cancel-in-progress: false

# changesets writes: it commits version bumps, pushes tags and cuts GitHub releases,
# and opens the "Version Packages" pull request.
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Build packages
        run: pnpm build

      - name: Publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Slack Notification
        if: steps.changesets.outputs.published == 'true'
        uses: slackapi/slack-github-action@v4
        with:
          webhook-type: webhook-trigger
          payload: |
            {
              "package_name": "@bamboocss/dev",
              "changelog_url": "https://github.com/bamboocss/bamboo/blob/main/CHANGELOG.md"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
